<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content='width=device-width, initial-scale=1'>
    <title>Snake Water Gun Game</title>
    <link rel='stylesheet' href='main.css'>
    <script src="main.js" defer></script>
</head>
<body>
    <div class="head">
        <!-- <img src="SWG-project.png/Wood-img1.jpg"> -->
        <h1 class="head-image">Snake Water Gun</h1>
    </div>
    
    <div class="main-container">
        <div class="snake-body">
            <img class="snake-image" src="SWG-project.png/Snake_img.jpg">
            <!-- <p class="snake">Snake</p> -->
             <button class="snake">Snake</button>
        </div>

        <div class="water-body">
            <img class="water-image" src="SWG-project.png/Water-img.jpg">
            <!-- <p class="water">Water</p> -->
             <button class="water">Water</button>
        </div>

        <div class="gun-body">
            <img class="gun-image" src="SWG-project.png/Gun-img.jpg">
            <!-- <p class="gun">Gun</p> -->
             <button class="gun">Gun</button>            
        </div>
    </div>

    <div class="moves-button"></div>
    <div class="score">
        <!-- <img class="score-image" src="SWG-project.png/Wood-img2.jpg"> -->
        <p class="result">You Win!!</p>
        <p class="score-tracker">Win: 0, Loss: 0, Tie: 0 </p>
    </div>
</body>
</html>
